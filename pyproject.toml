[project]
name = "tinyinfer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.4.0",
    "safetensors>=0.8.0",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "transformers>=5.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
